[project]
name = "codewright"
version = "0.1.0"
description = "A Codex-inspired Python coding agent"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = {text = "MIT"}

dependencies = [
    "pydantic>=2.6",
    "httpx>=0.27",
    "rich>=13.7",
    "openai>=1.40",
    "prompt-toolkit>=3.0",
    "mcp>=1.27,<2",
]

[project.scripts]
codewright = "codewright.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/codewright"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "import-linter>=2.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"src/codewright/tools/handlers/_patch_matcher.py" = ["RUF001"]
"tests/test_apply_patch.py" = ["RUF001"]

[tool.coverage.run]
source = ["src/codewright"]
omit = ["**/__main__.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
